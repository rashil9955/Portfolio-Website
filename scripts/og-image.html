<!doctype html>
<!-- Source for public/og-image.png (1200×630). Regenerate with: npm run og-image -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Climate+Crisis:YEAR@1979..2050&family=Comfortaa:wght@400&family=Darker+Grotesque:wght@400;700&display=block"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #fdfbd4;
        color: #000;
      }
      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 1200px;
        height: 630px;
      }
      .strip {
        margin-top: 92px;
        width: 100%;
        white-space: pre;
        overflow: hidden;
        font-family: 'Comfortaa', sans-serif;
        font-size: 17px;
        text-align: center;
      }
      h1 {
        margin: 56px 0 0;
        font-family: 'Climate Crisis', sans-serif;
        font-variation-settings: 'YEAR' 1979;
        font-weight: 400;
        font-size: 112px;
        line-height: 1;
        text-align: center;
      }
      .subtitle {
        margin: 34px 0 0;
        font-family: 'Comfortaa', sans-serif;
        font-size: 30px;
      }
      .footer {
        position: absolute;
        bottom: 38px;
        font-family: 'Darker Grotesque', sans-serif;
        font-size: 26px;
        letter-spacing: 0.02em;
      }
      .footer b {
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="strip">RASHIL SHIBAKOTI    RASHIL SHIBAKOTI   RASHIL SHIBAKOTI    RASHIL SHIBAKOTI   RASHIL SHIBAKOTI    RASHIL SHIBAKOTI   RASHIL SHIBAKOTI    RASHIL SHIBAKOTI   RASHIL SHIBAKOTI</div>
      <h1>RASHIL<br />SHIBAKOTI</h1>
      <p class="subtitle">Software, accessibility &amp; creative work</p>
      <p class="footer"><b>rshibak.com</b></p>
    </div>
  </body>
</html>
